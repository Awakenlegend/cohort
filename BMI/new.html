<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style src="style.css"></style>
    <title>BMI CALCULATOR</title>
</head>
<body>
    <h2>BMI CALCULATOR</h2>
    <label for="Weight"> weight(kgs)</label>
    <input type="number" id="Weight" placeholder="Enter your weight in kgs"><br>
    <label for="Height">height in Feet</label>
    <input type="cm" id="Height" placeholder="Enter your height in cm"><br>
    <button onclick="calculateBMI()">Calculate BMI</button>
    <button onclick="reload()">clear</button>
    

    <h4 id="heading"></h4>
    <p id="bmi-output"></p>
    <p id="message"></p>
    <script src="script.js"></script>
</body>
</html>
